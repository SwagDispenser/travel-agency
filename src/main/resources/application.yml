server:
  port: 8080

spring:
  application:
    name: travel-agency
  datasource:
    url: jdbc:h2:file:./data/travel-agency;AUTO_SERVER=TRUE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID:travel-agency-ui}
            client-secret: ${OIDC_CLIENT_SECRET:travel-agency-secret}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/travel-agency}
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/travel-agency}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/realms/travel-agency/protocol/openid-connect/certs}

logging:
  level:
    org.springframework.security: INFO
