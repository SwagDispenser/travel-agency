server:
  port: 8082

spring:
  application:
    name: booking-service
  datasource:
    url: ${DATASOURCE_URL:jdbc:h2:file:./data/bookings;AUTO_SERVER=TRUE;MODE=PostgreSQL}
    username: sa
    password:
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:travel}
    password: ${RABBITMQ_PASSWORD:travel}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
