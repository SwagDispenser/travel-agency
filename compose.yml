services:
  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: travel
      RABBITMQ_DEFAULT_PASS: travel
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  booking-service:
    profiles: [apps]
    build: ./booking-service
    ports:
      - "8082:8082"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: travel
      RABBITMQ_PASSWORD: travel
      DATASOURCE_URL: jdbc:h2:file:/app/data/bookings;MODE=PostgreSQL
    volumes:
      - booking-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  tour-service:
    profiles: [apps]
    build: ./tour-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: travel
      RABBITMQ_PASSWORD: travel
      DATASOURCE_URL: jdbc:h2:file:/app/data/tours;MODE=PostgreSQL
      JWT_ISSUER_URI: http://localhost:8081/realms/travel-agency
      JWT_JWK_SET_URI: http://keycloak:8080/realms/travel-agency/protocol/openid-connect/certs
    volumes:
      - tour-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  rabbitmq-data:
  booking-data:
  tour-data:
